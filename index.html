<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Siqi Han</title>
  <style>
    :root {
      color: #192734;
      background: #f4f7fa;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
    }

    body {
      margin: 0;
    }

    main {
      box-sizing: border-box;
      max-width: 44rem;
      margin: clamp(2rem, 10vh, 6rem) auto;
      padding: 0 1.25rem;
    }

    article {
      padding: clamp(1.5rem, 6vw, 3.5rem);
      border: 1px solid #dce5ed;
      border-top: 4px solid #235680;
      border-radius: 0.75rem;
      background: #fff;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .affiliation {
      margin: 0.75rem 0 0;
      color: #475a6b;
      font-size: 1.125rem;
    }

    dl {
      margin: 1.75rem 0 0;
      padding-top: 1.25rem;
      border-top: 1px solid #dce5ed;
    }

    dt {
      font-weight: 650;
    }

    dd {
      margin: 0 0 0.85rem;
    }

    dd:last-child {
      margin-bottom: 0;
    }

    a {
      color: #235680;
      text-underline-offset: 0.15em;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <article aria-labelledby="name">
      <h1 id="name">Siqi Han</h1>
      <p class="affiliation">
        University of Science and Technology of China<br>
        <span lang="zh-CN">中国科学技术大学</span>
      </p>
      <dl>
        <dt>Email</dt>
        <dd><a href="mailto:siqihan@mail.ustc.edu.cn">siqihan@mail.ustc.edu.cn</a></dd>
        <dt>GitHub</dt>
        <dd><a href="https://github.com/Hansiqii">@Hansiqii</a></dd>
      </dl>
    </article>
  </main>
</body>
</html>
